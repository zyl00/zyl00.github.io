<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="nav-brand" href="#about-me">
        <span class="brand-mark">YZ</span>
        <span class="brand-name">Yulong Zhang</span>
      </a>
      <ul>
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url }}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-text">Theme</span>
      </button>
    </nav>
  </div>
</div>
